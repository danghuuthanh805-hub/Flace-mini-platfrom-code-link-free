<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio App Vô Hạn Không Lỗi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0c0c12; color: #e2e2e9; padding: 12px; }
        h3 { text-align: center; color: #00ff66; margin: 5px 0 15px 0; text-shadow: 0 0 10px rgba(0,255,102,0.3); font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        
        .tool-box { background: #151522; padding: 15px; border-radius: 14px; border: 1px solid #232338; margin-bottom: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .btn-upload { display: block; width: 100%; padding: 12px; background: linear-gradient(45deg, #2196F3, #00b0ff); color: white; border-radius: 8px; font-weight: bold; text-align: center; cursor: pointer; margin-bottom: 12px; font-size: 13px; }
        .input-group { display: flex; gap: 8px; margin-bottom: 5px; }
        input[type="text"] { flex: 1; padding: 11px; background: #08080e; border: 1px solid #31314a; border-radius: 8px; color: white; outline: none; font-size: 13px; }
        input[type="text"]:focus { border-color: #00ff66; }
        
        .btn-add { padding: 0 18px; background: #00ff66; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }

        .file-list-title { font-size: 12px; color: #888; text-transform: uppercase; margin: 12px 0 6px 2px; font-weight: bold; }
        .file-container { max-height: 150px; overflow-y: auto; background: #08080e; border-radius: 8px; border: 1px solid #232338; padding: 6px; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #181826; margin-bottom: 6px; border-radius: 6px; border-left: 4px solid #555; }
        .file-item.active { border-left-color: #00ff66; background: #16261d; }
        .file-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; cursor: pointer; color: #fff; }
        .file-actions button { background: none; border: none; color: #999; margin-left: 12px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .file-actions .btn-del { color: #ff3366; }
        .file-actions .btn-ren { color: #00b0ff; }

        textarea { width: 100%; height: 26vh; background-color: #0a0a10; color: #a9dc76; border: 1px solid #232338; border-radius: 12px; padding: 12px; font-family: monospace; font-size: 13px; resize: none; outline: none; margin-bottom: 12px; line-height: 1.5; }
        
        .control-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .control-group button { padding: 13px; font-size: 12px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; text-transform: uppercase; }
        .btn-run { background: #4caf50; }
        .btn-full { background: #9c27b0; }
        .btn-pub { background: #ff007f; box-shadow: 0 4px 12px rgba(255,0,127,0.3); }

        #linkContainer { background: #102216; padding: 12px; border-radius: 10px; margin-bottom: 12px; word-break: break-all; display: none; text-align: center; border: 1px dashed #00ff66; font-size: 13px; }
        #linkContainer a { color: #00ff66; font-weight: bold; text-decoration: none; }

        .preview-box { width: 100%; height: 34vh; background: #fff; border: 1px solid #232338; border-radius: 12px; display: block; }
        #fullScreenWrapper { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; }
        #fullScreenWrapper iframe { width: 100%; height: 100%; border: none; }
        #closeFullBtn { position: absolute; top: 15px; right: 15px; background: rgba(255, 0, 85, 0.95); padding: 8px 18px; border-radius: 6px; color: white; border: none; font-weight: bold; z-index: 10000; font-size: 13px; }
    </style>
</head>
<body>

    <h3>📦 APP STUDIO UNCRASHABLE V3</h3>
    
    <div class="tool-box">
        <label class="btn-upload">📂 TẢI LÊN TỆP (.HTML / .ZIP)
            <input type="file" id="fileUploader" accept=".html,.zip" style="display: none;" onchange="handleFileUpload(event)">
        </label>
        
        <div class="input-group">
            <input type="text" id="newFileName" placeholder="Tên tệp tin thủ công mới...">
            <button type="button" class="btn-add" onclick="createNewFileManual()">Tạo Mới</button>
        </div>

        <div class="file-list-title">Danh sách tệp tin hiện tại:</div>
        <div class="file-container" id="fileListWrapper"></div>
    </div>

    <textarea id="codeEditor" placeholder="Nhập hoặc chỉnh sửa mã nguồn tại đây..."></textarea>
    <script src="https://cloudflare.com"></script>

    <div class="control-group">
        <button type="button" class="btn-run" onclick="runPreviewCode()">▶ Chạy Code</button>
        <button type="button" class="btn-full" onclick="openFullScreenApp()">💻 Xem Full</button>
        <button type="button" class="btn-pub" onclick="publishAppToCloudVohan()">🚀 Xuất Bản</button>
    </div>

    <div id="linkContainer">
        🎉 Đã xuất bản thành công App siêu cấp! Link ID vô hạn của em:<br>
        <a id="generatedLink" href="#" target="_blank">Đang tải liên kết...</a>
    </div>

    <iframe id="previewIframe" class="preview-box"></iframe>

    <div id="fullScreenWrapper">
        <button type="button" id="closeFullBtn" onclick="closeFullScreenApp()">Thoát Xem</button>
        <iframe id="fullScreenIframe"></iframe>
    </div>

    <script>
        const currentGithubRepoUrl = window.location.href.split('?')[0];

        let virtualFiles = {
            "index.html": "<!DOCTYPE html>\n<html>\n<head>\n<style>body{text-align:center;background:#111;color:#fff;font-family:Arial;margin-top:40px;}</style>\n</head>\n<body>\n<h2>Ứng Dụng Đã Chạy Thành Công!</h2>\n<p>Bấm nút Chạy Code mượt mà không lo bị tắt nữa nhé.</p>\n</body>\n</html>"
        };
        let currentActiveFile = "index.html";

        const editor = document.getElementById("codeEditor");
        const fileListWrapper = document.getElementById("fileListWrapper");
        const previewIframe = document.getElementById("previewIframe");
        const fullIframe = document.getElementById("fullScreenIframe");
        const fullWrapper = document.getElementById("fullScreenWrapper");
        const linkContainer = document.getElementById("linkContainer");
        const generatedLink = document.getElementById("generatedLink");

        editor.addEventListener("input", () => {
            virtualFiles[currentActiveFile] = editor.value;
        });

        function renderFileList() {
            fileListWrapper.innerHTML = "";
            for (let name in virtualFiles) {
                let item = document.createElement("div");
                item.className = "file-item" + (name === currentActiveFile ? " active" : "");
                
                item.innerHTML = `
                    <div class="file-name" onclick="switchActiveFile('${name}')">📄 ${name}</div>
                    <div class="file-actions">
                        <button type="button" class="btn-ren" onclick="renameVirtualFile('${name}')">Đổi tên</button>
                        <button type="button" class="btn-del" onclick="deleteVirtualFile('${name}')">Xóa</button>
                    </div>
                `;
                fileListWrapper.appendChild(item);
            }
            editor.value = virtualFiles[currentActiveFile] || "";
        }

        function switchActiveFile(name) {
            currentActiveFile = name;
            renderFileList();
            runPreviewCode();
        }

        function createNewFileManual() {
            let name = document.getElementById("newFileName").value.trim();
            if (!name) { alert("Chưa điền tên file!"); return; }
            if (!name.endsWith(".html") && !name.endsWith(".js") && !name.endsWith(".css")) {
                name += ".html";
            }
            if (virtualFiles[name]) { alert("Tên tệp này đã tồn tại!"); return; }
            
            virtualFiles[name] = `<!DOCTYPE html>\n<html>\n<body>\n<h2>Ứng dụng mới: ${name}</h2>\n</body>\n</html>`;
            document.getElementById("newFileName").value = "";
            switchActiveFile(name);
        }

        function deleteVirtualFile(name) {
            if (Object.keys(virtualFiles).length <= 1) {
                alert("Cần giữ lại ít nhất 1 file!");
                return;
            }
            if (confirm(`Xóa file [ ${name} ] không?`)) {
                delete virtualFiles[name];
                if (currentActiveFile === name) {
                    currentActiveFile = Object.keys(virtualFiles)[0];
                }
                renderFileList();
                runPreviewCode();
            }
        }
        function renameVirtualFile(oldName) {
            let newName = prompt("Nhập tên mới cho file này:", oldName);
            if (!newName || newName.trim() === oldName) return;
            newName = newName.trim();
            if (virtualFiles[newName]) { alert("Tên tệp tin mới bị trùng!"); return; }
            
            virtualFiles[newName] = virtualFiles[oldName];
            delete virtualFiles[oldName];
            if (currentActiveFile === oldName) currentActiveFile = newName;
            renderFileList();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0]; 
            if (!file) return;

            const reader = new FileReader();

            if (file.name.endsWith(".zip")) {
                reader.onload = function(e) {
                    JSZip.loadAsync(e.target.result).then(function(zip) {
                        let promises = [];
                        zip.forEach(function (relativePath, zipEntry) {
                            if (!zipEntry.dir && (zipEntry.name.endsWith(".html") || zipEntry.name.endsWith(".js") || zipEntry.name.endsWith(".css"))) {
                                let p = zipEntry.async("string").then(function(content) {
                                    virtualFiles[zipEntry.name] = content;
                                });
                                promises.push(p);
                            }
                        });
                        Promise.all(promises).then(() => {
                            let keys = Object.keys(virtualFiles);
                            let htmlFile = keys.find(k => k.endsWith(".html"));
                            currentActiveFile = htmlFile ? htmlFile : keys[0];
                            renderFileList();
                            runPreviewCode();
                        });
                    });
                };
                reader.readAsArrayBuffer(file);
            } else if (file.name.endsWith(".html")) {
                reader.onload = function(e) {
                    virtualFiles[file.name] = e.target.result;
                    currentActiveFile = file.name;
                    renderFileList();
                    runPreviewCode();
                };
                reader.readAsText(file);
            }
            event.target.value = ""; 
        }

        function injectSafeEnvironment(rawCode) {
            if (!rawCode) return "";
            let injectedSetup = `
                <script>
                    Object.defineProperty(window, 'onload', {
                        set: function(fn) { 
                            console.log('Chặn lệnh lặp onload gây sập màn hình');
                            setTimeout(fn, 100); 
                        },
                        configurable: true
                    });
                <\/script>
            `;
            if (rawCode.includes("<html>")) {
                return rawCode.replace("<html>", "<html>" + injectedSetup);
            } else if (rawCode.includes("<head>")) {
                return rawCode.replace("<head>", "<head>" + injectedSetup);
            }
            return injectedSetup + rawCode;
        }

        function runPreviewCode() {
            const targetCode = virtualFiles[currentActiveFile] || "";
            const safeCode = injectSafeEnvironment(targetCode);
            const blob = new Blob([safeCode], { type: 'text/html;charset=utf-8' });
            previewIframe.src = URL.createObjectURL(blob);
        }

        function openFullScreenApp() {
            const targetCode = virtualFiles[currentActiveFile] || "";
            const safeCode = injectSafeEnvironment(targetCode);
            fullWrapper.style.display = "block";
            const blob = new Blob([safeCode], { type: 'text/html;charset=utf-8' });
            fullIframe.src = URL.createObjectURL(blob);
        }

        function closeFullScreenApp() {
            fullWrapper.style.display = "none";
            fullIframe.src = ""; 
        }

        // SỬA LỖI URL TOO LONG: Đẩy thẳng lên máy chủ ẩn danh để lấy mã ID siêu ngắn gọn
        function publishAppToCloudVohan() {
            const currentCode = virtualFiles[currentActiveFile];
            if (!currentCode) { alert("File trống!"); return; }

            const pubBtn = document.querySelector(".btn-pub");
            pubBtn.disabled = true;
            pubBtn.innerText = "⏳ Đang tạo ID ngắn...";

            // Sử dụng kho lưu trữ đám mây ẩn danh siêu tốc để lấy ID ngắn gọn
            fetch("https://jsonbin.io", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ html: currentCode })
            })
            .then(res => res.json())
            .then(data => {
                if (data.metadata && data.metadata.id) {
                    const shortCloudId = data.metadata.id;
                    // Tạo ra link siêu ngắn gọn không lo bị lỗi độ dài URL
                    const finalPublishedLink = currentGithubRepoUrl[0] + "?id=" + shortCloudId;
                    
                    generatedLink.href = finalPublishedLink;
                    generatedLink.innerText = finalPublishedLink;
                    linkContainer.style.display = "block";
                } else {
                    alert("Lỗi máy chủ đám mây không cấp được ID ngắn!");
                }
            })
            .catch(err => alert("Lỗi kết nối đám mây: " + err))
            .finally(() => {
                pubBtn.disabled = false;
                pubBtn.innerText = "🚀 Xuất Bản";
            });
        }

        // BỘ ĐỌC TỰ ĐỘNG PHÂN TÍCH ID SIÊU NGẮN KHI MỞ LINK
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');
            const codeParam = urlParams.get('code'); // Dự phòng nếu dùng link cũ
            
            if (idParam) {
                document.body.innerHTML = "<div style='display:flex; justify-content:center; align-items:center; height:100vh; font-weight:bold; color:#00ff66; background:#0d0d14;'>🤖 AI đang tải App có ID: " + idParam + " ...</div>";
                
                // Kéo code từ đám mây ẩn danh về điện thoại thông qua ID số ngắn gọn
                fetch("https://jsonbin.io/" + idParam, { method: "GET" })
                .then(res => res.json())
                .then(data => {
                    if (data.record && data.record.html) {
                        document.body.innerHTML = '<iframe srcdoc="" id="directRunningIframe" style="width:100vw; height:100vh; border:none; margin:0; padding:0; overflow:hidden; position:fixed; top:0; left:0;"></iframe>';
                        document.getElementById("directRunningIframe").srcdoc = data.record.html;
                    } else {
                        document.body.innerHTML = "<h3 style='color:red; text-align:center; margin-top:50px;'>Không tìm thấy App ứng với ID này!</h3>";
                    }
                })
                .catch(err => {
                    document.body.innerHTML = "<h3 style='color:red; text-align:center; margin-top:50px;'>Lỗi đường truyền tải App đám mây!</h3>";
                });
            } else if (codeParam) {
                // Bộ đọc giải mã dự phòng nếu em chạy link nén cũ
                try {
                    const decodedCode = decodeURIComponent(atob(codeParam).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                    document.body.innerHTML = '<iframe srcdoc="" id="directRunningIframe" style="width:100vw; height:100vh; border:none; margin:0; padding:0; overflow:hidden; position:fixed; top:0; left:0;"></iframe>';
                    document.getElementById("directRunningIframe").srcdoc = decodedCode;
                } catch(e) { document.body.innerHTML = "<h3 style='color:red;'>Lỗi giải mã link cũ!</h3>"; }
            } else {
                renderFileList();
                runPreviewCode();
            }
        }
    </script>
</body>
</html>
